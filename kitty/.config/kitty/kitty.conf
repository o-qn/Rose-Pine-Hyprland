# ─────────────────────────────────────
# Font
# ─────────────────────────────────────
font_family FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0
disable_ligatures never


# ─────────────────────────────────────
# Window
# ─────────────────────────────────────
window_padding_width 12
window_margin_width 0

background_opacity 0.94
dynamic_background_opacity yes

confirm_os_window_close 0


# ─────────────────────────────────────
# Cursor
# ─────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5


# ─────────────────────────────────────
# Scrollback
# ─────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 3.0


# ─────────────────────────────────────
# Tabs
# ─────────────────────────────────────
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom


# ─────────────────────────────────────
# Rosé Pine Moon
# ─────────────────────────────────────

background              #232136
foreground              #e0def4

selection_background    #44415a
selection_foreground    #e0def4

cursor                   #ea9a97
cursor_text_color        #232136

url_color                #9ccfd8

active_border_color      #c4a7e7
inactive_border_color    #393552
bell_border_color        #f6c177


# Black
color0   #393552
color8   #6e6a86

# Red / Love
color1   #eb6f92
color9   #eb6f92

# Green / Pine
color2   #3e8fb0
color10  #3e8fb0

# Yellow / Gold
color3   #f6c177
color11  #f6c177

# Blue / Foam
color4   #9ccfd8
color12  #9ccfd8

# Magenta / Iris
color5   #c4a7e7
color13  #c4a7e7

# Cyan / Rose
color6   #ea9a97
color14  #ea9a97

# White
color7   #e0def4
color15  #e0def4


# ─────────────────────────────────────
# Tab colors
# ─────────────────────────────────────
active_tab_background    #c4a7e7
active_tab_foreground    #232136

inactive_tab_background  #2a273f
inactive_tab_foreground  #908caa
